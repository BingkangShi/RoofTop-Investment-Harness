services:
  neo4j:
    image: neo4j:2026.06.0
    container_name: rooftop-neo4j
    restart: unless-stopped
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}"
    volumes:
      - ../data_lake/neo4j/data:/data
      - ../data_lake/neo4j/logs:/logs
      - ../data_lake/graphs:/import:ro
